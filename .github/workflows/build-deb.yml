name: Build Debian Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-deb:
    # Build natively per-arch. heplify-server is a cgo build (libluajit), so
    # cross-compiling is painful — use GitHub's native arm64 hosted runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from git
        id: version
        run: |
          if git describe --tags --match 'v*' HEAD 2>/dev/null; then
            VERSION=$(git describe --tags --match 'v*' HEAD)
            VERSION=${VERSION#v}
          else
            VERSION="0.0.1-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Create debian symlink
        run: ln -s packaging/debian debian

      - name: Update debian changelog
        run: |
          cat > debian/changelog << EOF
          heplify-server (${{ steps.version.outputs.VERSION }}) unstable; urgency=medium

            * Release ${{ steps.version.outputs.VERSION }}

           -- Dave Horton <daveh@drachtio.org>  $(date -R)
          EOF

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper libluajit-5.1-dev

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b -d

      - name: Prepare artifacts
        run: |
          cp ../heplify-server*.deb .
          sha256sum heplify-server*.deb > heplify-server_${{ steps.version.outputs.VERSION }}_${{ matrix.arch }}.deb.sha256
          ls -la heplify-server*

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_S3_REGION }}

      - name: Copy to S3
        run: |
          aws s3 cp heplify-server*.deb s3://${{ secrets.AWS_S3_BUCKET }}/heplify-server/
          aws s3 cp heplify-server*.sha256 s3://${{ secrets.AWS_S3_BUCKET }}/heplify-server/

  # Reindex the apt repo once, after BOTH arch builds have uploaded — a
  # separate job (not an in-job step) so the dispatch fires a single time
  # rather than once per matrix leg. apt-repo's publish.yml is stateless:
  # it rescans every .deb in the bucket and files each by its control
  # Architecture field, so the amd64 and arm64 .debs land in the right
  # per-arch index.
  notify-apt-repo:
    needs: build-deb
    runs-on: ubuntu-22.04
    # Fires only on real tag pushes (not on workflow_dispatch testing).
    # The PAT (APT_REPO_PAT) is a fine-grained token scoped to
    # jambonz/apt-repo with Actions: write.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Trigger apt-repo publish
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.APT_REPO_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jambonz/apt-repo/dispatches \
            -d '{"event_type":"package-uploaded","client_payload":{"repo":"${{ github.repository }}","tag":"${{ github.ref_name }}"}}'
